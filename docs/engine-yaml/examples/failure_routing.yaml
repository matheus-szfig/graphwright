workflow: failure_routing
version: 1
portal: acme-records
inputs:
  approved: {type: string, pii: false, default: 'false'}
start: validate
nodes:
  validate:
    recognize: {always: true}
    actions:
      - script:
          into: decision
          args: {approved: "{approved}"}
          code: 'return {approved: args.approved === "true"};'
      - assert:
          condition: {var: {name: decision.approved, op: eq, value: true}}
          message: Approval flag was not true
    transitions: [{to: done}]
    on_fail: classify_failure
  classify_failure:
    recognize: {var: {name: _error, op: set}}
    transitions:
      - to: rejected
        when: {var: {name: _error.type, op: eq, value: StructuralError}}
      - to: unexpected
  rejected:
    terminal: outcome
    result: {status: approval_missing}
  unexpected:
    terminal: failure
    result: {status: unexpected_error}
  done:
    terminal: success
# This is an assertion/routing demonstration, not an interactive human approval step.
