[project]
name = "graphwright"
version = "0.1.0"
description = "Graph-driven browser automation: workflows as YAML graphs of recognizable page states, run by a Celery worker with a stealth Playwright browser"
requires-python = ">=3.13"
dependencies = [
    # queue/ — Celery + Redis broker/result backend
    "celery[redis]>=5.4",
    "redis>=5.0",
    # storage/ — PostgreSQL (async pool), S3 for failure evidence and session jars
    "asyncpg>=0.29",
    "aiobotocore>=2.13",
    # browser/ — Playwright + stealth patches
    "playwright>=1.47",
    "playwright-stealth>=2.0.3",
    # config.py — single env var boundary
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",  # credentials/local.py reads GW_CRED_* from .env on host runs
    # engine/schema.py — graphs are YAML
    "pyyaml>=6.0",
    # engine/requests.py + credentials/http.py — graph requests and HTTP credential leases
    "httpx>=0.27",
    # engine/sandbox.py — code nodes run in a fresh V8 isolate (no I/O, CPU + memory limits)
    "mini-racer>=0.12",
]

[project.scripts]
graphwright = "graphwright.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.11.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "graphwright"
module-root = "src"
